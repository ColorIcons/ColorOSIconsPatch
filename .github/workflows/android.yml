name: Android CI/CD

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_abis:
        description: 'Comma-separated ABI filters; empty keeps all ABIs'
        required: false
        default: ''
      release_locales:
        description: 'Comma-separated Android locales; empty keeps all locales'
        required: false
        default: ''

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  RELEASE_ABIS: ${{ inputs.release_abis || '' }}
  RELEASE_LOCALES: ${{ inputs.release_locales || '' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not configured" >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is not configured" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is not configured" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is not configured" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"

      - name: Build debug APK
        if: startsWith(github.ref, 'refs/tags/') == false
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon :app:assembleRelease
          -Prelease.version="${GITHUB_REF_NAME#v}"
          -PreleaseKeystore=$RUNNER_TEMP/signing/release.jks
          -PreleaseKeystorePassword="$KEYSTORE_PASSWORD"
          -PreleaseKeyAlias="$KEY_ALIAS"
          -PreleaseKeyPassword="$KEY_PASSWORD"
          -Prelease.minify=true
          -Prelease.shrinkResources=true
          ${{ env.RELEASE_ABIS != '' && format('-Prelease.abis={0}', env.RELEASE_ABIS) || '' }}
          ${{ env.RELEASE_LOCALES != '' && format('-Prelease.locales={0}', env.RELEASE_LOCALES) || '' }}

      - name: Upload debug artifact
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v6
        with:
          name: ColorOSIconsPatch-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: ColorOSIconsPatch-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
