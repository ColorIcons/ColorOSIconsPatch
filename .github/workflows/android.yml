name: Android CI/CD

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_abis:
        description: 'Comma-separated ABI filters; empty keeps all ABIs'
        required: false
        default: ''
      release_locales:
        description: 'Comma-separated Android locales; empty keeps all locales'
        required: false
        default: ''

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  RELEASE_ABIS: ${{ inputs.release_abis || '' }}
  RELEASE_LOCALES: ${{ inputs.release_locales || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37'

      - name: Build debug APK
        if: startsWith(github.ref, 'refs/tags/') == false
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          ./gradlew --no-daemon :app:assembleRelease
          -Prelease.minify=true
          -Prelease.shrinkResources=true
          ${{ env.RELEASE_ABIS != '' && format('-Prelease.abis={0}', env.RELEASE_ABIS) || '' }}
          ${{ env.RELEASE_LOCALES != '' && format('-Prelease.locales={0}', env.RELEASE_LOCALES) || '' }}

      - name: Upload debug artifact
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: ColorOSIconsPatch-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ColorOSIconsPatch-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
